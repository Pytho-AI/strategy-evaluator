<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<!-- Recovered design-system CSS, in the document order the artifact used:
     tokens + Barlow faces, then the Source Sans 3 faces, then the app's
     own overrides. Byte-identical to the artifact's three <style> islands
     apart from the font url() rewrites. -->
<link rel="stylesheet" href="./src/styles/01-industry-tokens.css">
<link rel="stylesheet" href="./src/styles/02-source-sans-3.css">
<link rel="stylesheet" href="./src/styles/03-app-overrides.css">

<style>
  /* Page chrome added during recovery — not part of the artifact. */
  #classification-marking {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    z-index: 2147483647; pointer-events: none;
    font: 600 11px/1 var(--font-body, system-ui, sans-serif);
    letter-spacing: .14em; text-transform: uppercase;
    color: rgb(254, 243, 221); background: rgb(130, 78, 0);
    border: 1px solid rgb(130, 78, 0); border-bottom: 0;
    border-radius: 4px 4px 0 0; padding: 5px 12px;
  }
  /* Shown instead of the app when GET /api/meta fails. */
  #boot-error {
    max-width: 640px; margin: 12vh auto; padding: 24px 28px;
    border: 1px solid rgb(174, 25, 85); border-radius: 8px;
    background: rgb(30, 8, 18); color: rgb(254, 236, 244);
    font: 14px/1.6 var(--font-body, system-ui, sans-serif);
  }
  #boot-error h1 { font-size: 22px; margin: 0 0 10px; }
  #boot-error .code {
    margin: 0 0 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  }
  #boot-error .msg { margin: 0 0 12px; }
  #boot-error .hint { margin: 0; opacity: .75; font-size: 13px; }
</style>

<!-- React 18.3.1 UMD, vendored and pinned. Loading them here makes
     dc-runtime's loadReactUmd() short-circuit, so nothing is fetched from
     a CDN and the page works offline. -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<!-- @ds-bundle stub for the "Industry_indust" design-system namespace.
     Declares no components; kept because the artifact shipped it. -->
<script src="./vendor/ds-bundle-industry.js"></script>

<script src="./src/branding.js"></script>
<!-- window.API — the typed fetch client. Same-origin /api unless a page sets
     window.API_BASE before this script runs. -->
<script src="./src/api.js"></script>
<script src="./src/boot.js" defer></script>
</head>
<body>
<div id="classification-marking" role="note"></div>
<!-- boot.js fills this from src/app.dc.html, then loads vendor/dc-runtime.js,
     which compiles the template and replaces this element with #dc-root. -->
<x-dc></x-dc>
</body>
</html>
