<body>
<div class="tag">JIPOE Step 4 · Adversary COAs · <b id="threat">PRC</b> · Notional geography</div>
<div class="toggle"><button id="bL" class="on">Most Likely</button><button id="bD" class="on">Most Dangerous</button><button id="bT" class="on">Terrain</button></div>
<svg id="map"></svg>
<div class="callout"><div><b>MLCOA</b><span id="capL">Limited seizure under exercise cover</span></div><div><b class="d">MDCOA</b><span id="capD">Pre-emptive fires + multi-axis assault</span></div></div>
<div class="legend">
  <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="rgb(255,90,90)" stroke-width="3"></line></svg><span>Most likely COA — axis of advance</span>
  <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="rgb(255,90,90)" stroke-width="3" stroke-dasharray="6 4"></line></svg><span>Most dangerous COA — axis of advance</span>
  <svg width="28" height="14"><rect x="7" y="1" width="14" height="12" fill="none" stroke="rgb(255,90,90)" stroke-width="1.5"></rect><line x1="7" y1="1" x2="21" y2="13" stroke="rgb(255,90,90)" stroke-width="1.5"></line></svg><span>Adversary objective</span>
  <svg width="28" height="12"><circle cx="14" cy="6" r="5" fill="none" stroke="rgb(255,203,71)" stroke-dasharray="2 2"></circle></svg><span>Long-range fires WEZ</span>
  <svg width="28" height="12"><polygon points="14,1 26,11 2,11" fill="rgba(0,145,255,.25)" stroke="rgb(0,145,255)"></polygon></svg><span>Decisive terrain / key node</span>
</div>
<script>
const q = new URLSearchParams(location.search.slice(1) || location.hash.slice(1)); const threat = q.get('threat') || 'PRC';
document.getElementById('threat').textContent = threat;
// Notional scenario geometry per pacing threat (lon,lat). Not real plans.
const S = {
  Olvana: { center: [104.5, 13.5], scale: 1150, likely: [[[105.6,21.0],[104.6,18.6],[103.6,17.6]]], likelyObj: [[103.4,17.4,'Consolidate — defense in depth',12,-12,'start']], dangerous: [[[102.6,16.6],[101.6,14.6],[100.8,13.1]],[[109.2,14.6],[108.0,11.6],[106.9,10.9]],[[108.6,7.6],[105.0,4.4],[103.2,2.4]]], dangerousObj: [[100.8,13.1,'Gulf coast / Bangkok',-14,22,'end'],[106.9,10.9,'HCMC staging ports',14,22,'start'],[103.2,2.4,'Malacca approaches',14,14,'start']], wez: [[106.2,20.6,900]], terrain: [[102.8,17.4,'Udon Thani — CBRN zone',12,18,'start'],[108.2,16.05,'Da Nang',12,4,'start'],[100.5,13.75,'Bangkok — MNFA HQ',-12,-8,'end'],[101.4,5.6,'Straits of Malacca',12,4,'start']] },
  PRC: { center: [121.5, 24.2], scale: 1500, likely: [[[119.0,25.9],[120.4,25.3],[121.9,25.05]]], likelyObj: [[122.0,25.0,'Peripheral obj',14,24,'start']], dangerous: [[[117.6,23.4],[119.5,22.9],[120.3,22.9]],[[117.9,26.6],[120.0,26.4],[121.0,25.6]],[[118.8,21.6],[120.2,22.2]]], dangerousObj: [[120.3,22.9,'SW coast',-14,22,'end'],[121.0,25.6,'N ports',-14,-12,'end']], wez: [[116.9,24.4,1250]], terrain: [[122.9,25.6,'Chokepoint — N strait',12,-8,'start'],[120.9,21.5,'Southern approaches',12,16,'start'],[127.0,27.2,'Fwd airfield / IADS',-12,4,'end'],[125.4,22.4,'Cable landing site',12,4,'start']] },
  Russia: { center: [24, 56], scale: 1500, likely: [[[27.6,56.2],[25.2,56.9]]], likelyObj: [[25.2,56.9,'Border district']], dangerous: [[[23.1,53.2],[23.4,54.6],[24.0,55.6]],[[21.2,54.9],[23.4,54.9]]], dangerousObj: [[23.4,54.9,'Land corridor']], wez: [[20.5,54.7,900]], terrain: [[23.5,54.8,'Land corridor'],[21.0,55.7,'Coastal ports'],[25.3,54.7,'Airfield hub']] },
  Iran: { center: [54, 27], scale: 1600, likely: [[[56.3,27.2],[56.4,26.4]]], likelyObj: [[56.4,26.4,'Strait chokepoint']], dangerous: [[[51.4,32.6],[50.8,29.4],[50.1,26.3]],[[57.0,28.0],[58.0,25.5]]], dangerousObj: [[50.1,26.3,'Gulf infrastructure'],[58.0,25.5,'Sea lanes']], wez: [[52.5,30.5,1800]], terrain: [[56.5,26.6,'Strait chokepoint'],[50.6,26.2,'Naval base'],[54.4,24.4,'Air base']] },
  DPRK: { center: [127.5, 38.2], scale: 4200, likely: [[[126.9,38.4],[126.9,37.9]]], likelyObj: [[126.9,37.9,'Capital region']], dangerous: [[[127.6,38.6],[127.4,37.6]],[[126.0,38.3],[126.6,37.5]],[[128.4,38.6],[128.6,37.8]]], dangerousObj: [[127.4,37.6,'Capital region'],[128.6,37.8,'East coast']], wez: [[127.2,38.9,300]], terrain: [[126.6,37.5,'Port complex'],[127.0,37.5,'Capital'],[129.0,35.2,'Southern port']] },
  VEO: { center: [2, 15], scale: 1100, likely: [[[-1.5,17.0],[-0.5,15.5]]], likelyObj: [[-0.5,15.5,'Tri-border area']], dangerous: [[[1.5,14.5],[2.2,13.6]],[[-3.9,16.9],[-4.0,14.5]]], dangerousObj: [[2.2,13.6,'Capital approaches']], wez: [], terrain: [[-1.0,15.7,'River crossing'],[2.1,13.5,'Capital'],[-4.0,16.8,'Regional hub']] }
};
const sc = S[threat] || S.PRC;
const CAP = { Olvana: ['Consolidate gains; defense-in-depth; hybrid attrition; nuclear posturing', 'Renewed offensive to the Gulf coast; amphibious ops on ports; further WMD use; Malacca interdiction'] };
if (CAP[threat]) { document.getElementById('capL').textContent = CAP[threat][0]; document.getElementById('capD').textContent = CAP[threat][1]; }
const svg = d3.select('#map'); const g = svg.append('g');
const W = () => svg.node().clientWidth, H = () => svg.node().clientHeight;
let world;
function draw() {
  const w = W(), h = H(); if (!w || !h) return;
  const proj = d3.geoMercator().center(sc.center).scale(sc.scale * (Math.min(w, h) / 480)).translate([w / 2, h / 2]);
  const path = d3.geoPath(proj); g.selectAll('*').remove();
  g.append('rect').attr('width', w).attr('height', h).attr('fill', 'rgb(8,17,36)');
  const grat = d3.geoGraticule().step([2, 2]);
  g.append('path').attr('d', path(grat())).attr('fill', 'none').attr('stroke', 'rgb(30,41,59)').attr('stroke-width', .6);
  g.append('g').selectAll('path').data(world).join('path').attr('d', path).attr('fill', 'rgb(30,41,59)').attr('stroke', 'rgb(100,116,139)').attr('stroke-width', .8);
  const on = id => document.getElementById(id).classList.contains('on');
  const line = d3.line().x(d => proj(d)[0]).y(d => proj(d)[1]).curve(d3.curveCatmullRom.alpha(.6));
  const arrow = (pts, dash) => {
    const p = g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', 'rgb(255,90,90)').attr('stroke-width', 3.5).attr('stroke-linecap', 'round').attr('marker-end', 'url(#ah)');
    if (dash) p.attr('stroke-dasharray', '10 7');
  };
  svg.select('defs').remove();
  svg.append('defs').append('marker').attr('id', 'ah').attr('viewBox', '0 0 10 10').attr('refX', 8).attr('refY', 5).attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto-start-reverse').append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'rgb(255,90,90)');
  // WEZ
  if (on('bT')) sc.wez.forEach(([lon, lat, km]) => { const c = d3.geoCircle().center([lon, lat]).radius(km / 111.2)(); g.append('path').attr('d', path(c)).attr('fill', 'rgba(255,203,71,.06)').attr('stroke', 'rgb(255,203,71)').attr('stroke-dasharray', '3 4').attr('stroke-width', 1.2); const e = proj([lon, lat + km / 111.2]); const x = Math.max(70, Math.min(w - 70, e[0])), y = Math.max(62, Math.min(h - 10, e[1] + 14)); g.append('text').attr('class', 'lbl').attr('x', x).attr('y', y).attr('text-anchor', 'middle').style('fill', 'rgb(255,203,71)').text(`LRF WEZ ${km} km`); });
  // terrain
  if (on('bT')) sc.terrain.forEach(([lon, lat, name, dx = 12, dy = 4, an = 'start']) => { const p = proj([lon, lat]); g.append('path').attr('d', `M${p[0]},${p[1] - 8} L${p[0] + 8},${p[1] + 6} L${p[0] - 8},${p[1] + 6} Z`).attr('fill', 'rgba(0,145,255,.3)').attr('stroke', 'rgb(0,145,255)').attr('stroke-width', 1.5); g.append('text').attr('class', 'lbl').attr('x', p[0] + dx).attr('y', p[1] + dy).attr('text-anchor', an).text(name); });
  const obj = (lon, lat, name, dx = 13, dy = -10, an = 'start') => { const p = proj([lon, lat]); g.append('rect').attr('x', p[0] - 9).attr('y', p[1] - 9).attr('width', 18).attr('height', 18).attr('fill', 'rgba(255,90,90,.15)').attr('stroke', 'rgb(255,90,90)').attr('stroke-width', 1.5); g.append('line').attr('x1', p[0] - 9).attr('y1', p[1] - 9).attr('x2', p[0] + 9).attr('y2', p[1] + 9).attr('stroke', 'rgb(255,90,90)').attr('stroke-width', 1.5); g.append('text').attr('class', 'lbl red').attr('x', p[0] + dx).attr('y', p[1] + dy).attr('text-anchor', an).text('OBJ · ' + name); };
  if (on('bD')) { sc.dangerous.forEach(p => arrow(p, true)); sc.dangerousObj.forEach(o => obj(...o));  }
  if (on('bL')) { sc.likely.forEach(p => arrow(p, false)); sc.likelyObj.forEach(o => obj(...o));  }
}
fetch('./data/countries-110m.json').then(r => r.json()).then(t => { world = topojson.feature(t, t.objects.countries).features; draw(); });
['bL', 'bD', 'bT'].forEach(id => document.getElementById(id).addEventListener('click', e => { e.currentTarget.classList.toggle('on'); draw(); }));
new ResizeObserver(() => world && draw()).observe(document.body);
</script>
