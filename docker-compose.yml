services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: strategy-evaluation-workbench:latest
    container_name: strategy-workbench
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9010}:8765"
    environment:
      PORT: 8765
      STRATEGY_WORKSPACE_DIR: /data/workspace
    volumes:
      - workbench-state:/data
    # Caps so this stack can never starve the other services on a shared box.
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
    mem_limit: 2g
    cpus: 1.5
volumes:
  workbench-state:
